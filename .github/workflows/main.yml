name: Check SEC Bills

on:
  schedule:
    - cron: '0 4 * * *' # يعمل يومياً الساعة 4 صباحاً بتوقيت جرينتش
  workflow_dispatch:

jobs:
  run-checker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install puppeteer

      - name: Run script
        run: node index.js
